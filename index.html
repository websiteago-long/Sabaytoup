<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAY TOUP - Roblox TopUp</title>
    <!-- FontAwesome សម្រាប់ Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #111111;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ប៊ូតុងប្ដូរ Theme ពណ៌ស/ខ្មៅ */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--text-color);
            color: var(--text-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px var(--shadow-color);
            z-index: 100;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Header Card (ទម្រង់ 3D) */
        .header-card {
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 25px var(--shadow-color),
                        inset 0 2px 3px rgba(255,255,255,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: perspective(1000px) rotateX(2deg);
        }

        .store-icon {
            background: #d1d5db;
            color: #111;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .header-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Menu Section */
        .menu-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sidebar-indicators {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .indicator-bar {
            width: 8px;
            height: 35px;
            background-color: #8b5cf6;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(139, 92, 246, 0.4);
        }

        .indicator-bar:not(.active) {
            opacity: 0.6;
            height: 25px;
        }

        /* Roblox Card Button (3D & RGB Lighting) */
        .roblox-card-btn {
            position: relative;
            text-decoration: none;
            flex-grow: 1;
            border-radius: 18px;
            padding: 4px; /* ទំហំសម្រាប់ភ្លើង RGB រត់ជុំវិញ */
            overflow: hidden;
            transform: perspective(1000px) rotateX(5deg) translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 12px 30px var(--shadow-color);
        }

        .roblox-card-btn:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-5px);
            box-shadow: 0 18px 40px var(--shadow-color);
        }

        /* បែបផែនភ្លើង RGB ជុំវិញប៊ូតុង */
        .rgb-glow {
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            animation: rgbRotate 4s linear infinite;
            z-index: 1;
        }

        @keyframes rgbRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ផ្នែកខាងក្នុងប៊ូតុង */
        .card-content {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        .roblox-logo-box {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            gap: 15px;
            background: var(--card-bg);
        }

        /* Logo Roblox ទម្រង់ 3D */
        .roblox-cube {
            width: 40px;
            height: 40px;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .inner-cube {
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 3px;
            transform: rotate(20deg);
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 0.5px;
        }

        .sub-badge {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }
    </style>
</head>
<body>

    <!-- ប៊ូតុងសម្រាប់ប្ដូររវាង Dark Mode និង Light Mode -->
    <button class="theme-toggle-btn" id="themeToggleBtn">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="container">
        <!-- Header: SABAY TOUP -->
        <div class="header-card">
            <div class="store-icon">
                <i class="fa-solid fa-store"></i>
            </div>
            <h1>SABAY TOUP</h1>
        </div>

        <!-- Section: Roblox TopUp -->
        <div class="menu-section">
            <div class="sidebar-indicators">
                <span class="indicator-bar active"></span>
                <span class="indicator-bar"></span>
                <span class="indicator-bar"></span>
            </div>

            <!-- 3D Button with RGB Lighting -->
            <a href="#" class="roblox-card-btn">
                <div class="rgb-glow"></div>
                <div class="card-content">
                    <div class="roblox-logo-box">
                        <!-- Logo Roblox -->
                        <div class="roblox-cube">
                            <div class="inner-cube"></div>
                        </div>
                        <span class="brand-name">Roblox</span>
                    </div>
                    <div class="sub-badge">TopUp</div>
                </div>
            </a>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;
        const icon = themeToggleBtn.querySelector('i');

        // စစ်និតមើលការកំណត់ Theme ពីមុនរបស់អ្នកប្រើប្រាស់
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            htmlElement.setAttribute('data-theme', 'dark');
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        //ព្រឹត្តិការណ៍ចុចប្ដូរ Theme
        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                icon.classList.replace('fa-sun', 'fa-moon');
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        });
    </script>
</body>
</html>
