<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAY TOUP - Roblox TopUp</title>
    <!-- FontAwesome សម្រាប់ Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #111111;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header Card (ទម្រង់ 3D) */
        .header-card {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px var(--shadow-color),
                        inset 0 2px 3px rgba(255,255,255,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: perspective(1000px) rotateX(2deg);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* រូបផ្ទះ / Icon ហាង មានចលនាលោត */
        .store-icon {
            background: #d1d5db;
            color: #111;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            animation: bounceIcon 1.5s infinite ease-in-out;
        }

        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .store-icon:hover {
            animation-play-state: paused;
            transform: scale(1.1);
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
        }

        .header-card h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        /* ប៊ូតុងប្ដូរ Theme ដាក់ទទឹមខាងក្រោម Sabay Toup */
        .theme-toggle-btn-inline {
            background: var(--bg-color);
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: var(--text-color);
            padding: 3px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            width: max-content;
            margin-top: 4px;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .theme-toggle-btn-inline:hover {
            background: #8b5cf6;
            color: #ffffff;
        }

        /* User Profile Info on Header */
        .user-profile-display {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .username-tag {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Blue Tick Verified Badge */
        .blue-tick {
            color: #3b82f6;
            font-size: 0.8rem;
        }

        .logout-btn-sm {
            background: #ef4444;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.4);
        }

        .logout-btn-sm:hover {
            opacity: 0.9;
        }

        /* Menu Section */
        .menu-section {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .sidebar-indicators {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 15px;
        }

        .indicator-bar {
            width: 8px;
            height: 35px;
            background-color: #8b5cf6;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(139, 92, 246, 0.4);
        }

        .indicator-bar:not(.active) {
            opacity: 0.6;
            height: 25px;
        }

        /* Roblox Main Card */
        .roblox-main-card {
            flex-grow: 1;
            background-color: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 30px var(--shadow-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .roblox-main-card:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-3px);
            box-shadow: 0 16px 35px var(--shadow-color);
        }

        .roblox-logo-box {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
            background: var(--card-bg);
        }

        /* Logo Roblox ទម្រង់ 3D */
        .roblox-cube {
            width: 40px;
            height: 40px;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .inner-cube {
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 3px;
            transform: rotate(20deg);
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .sub-badge {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .sub-badge i {
            transition: transform 0.3s ease;
        }

        /* Pricing Packages Container (លាក់ទុកដំបូង) */
        .packages-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--card-bg);
        }

        .roblox-main-card.active .packages-container {
            max-height: 300px;
            padding: 15px;
        }

        .roblox-main-card.active .sub-badge i {
            transform: rotate(180deg);
        }

        /* Package Option Card with RGB Lighting */
        .package-card {
            position: relative;
            border-radius: 14px;
            padding: 3px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 5px 15px var(--shadow-color);
        }

        .rgb-glow {
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            animation: rgbRotate 4s linear infinite;
            z-index: 1;
        }

        @keyframes rgbRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .package-content {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 11px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .pkg-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-color);
        }

        .pkg-info i {
            color: #eab308;
        }

        .pkg-price {
            background: #8b5cf6;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 3px 8px rgba(139, 92, 246, 0.4);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 350px;
            padding: 25px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 15px 35px var(--shadow-color);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: transform 0.2s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        .btn-account {
            background-color: #3b82f6;
            color: #ffffff;
        }

        .btn-telegram {
            background-color: #229ed9;
            color: #ffffff;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-color);
            cursor: pointer;
        }

        /* Sub-Modal for Register/Login Forms */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .form-error {
            color: #ef4444;
            font-size: 0.8rem;
            text-align: center;
            min-height: 18px;
        }

        .switch-form-text {
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            color: #3b82f6;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header: SABAY TOUP -->
        <div class="header-card">
            <div class="header-left">
                <!-- រូបផ្ទះ / Icon ហាង មានចលនាលោត -->
                <div class="store-icon" id="storeModalBtn">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div class="header-title-box">
                    <h1>SABAY TOUP</h1>
                    <!-- ប៊ូតុងប្ដូរ Theme ដាក់នៅខាងក្រោមទទឹម Sabay Toup -->
                    <button class="theme-toggle-btn-inline" id="themeToggleBtn">
                        <i class="fa-solid fa-moon" id="themeIcon"></i>
                        <span id="themeText">Dark Mode</span>
                    </button>
                </div>
            </div>

            <!-- បង្ហាញឈ្មោះគណនីពេល Login រួច -->
            <div class="user-profile-display" id="userProfileDisplay" style="display: none;">
                <div class="username-tag" id="displayUsername">
                    <span>User</span>
                    <i class="fa-solid fa-circle-check blue-tick" title="Verified"></i>
                </div>
                <button class="logout-btn-sm" id="logoutBtn">ចាកចេញ</button>
            </div>
        </div>

        <!-- Section: Roblox TopUp (ចុចដើម្បីបង្ហាញកញ្ចប់តម្លៃ) -->
        <div class="menu-section">
            <div class="sidebar-indicators">
                <span class="indicator-bar active"></span>
                <span class="indicator-bar"></span>
                <span class="indicator-bar"></span>
            </div>

            <div class="roblox-main-card" id="robloxCard">
                <div class="roblox-logo-box">
                    <div class="roblox-cube">
                        <div class="inner-cube"></div>
                    </div>
                    <span class="brand-name">Roblox</span>
                </div>
                <div class="sub-badge">
                    <span>TopUp Packages</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>

                <!-- តារាងតម្លៃដែលលាក់ទុក -->
                <div class="packages-container">
                    
                    <!-- Option 1: 40 Robux -->
                    <a href="https://t.me/Longzzsmmdigitall" target="_blank" class="package-card">
                        <div class="rgb-glow"></div>
                        <div class="package-content">
                            <div class="pkg-info">
                                <i class="fa-solid fa-coins"></i>
                                <span>40 Robux</span>
                            </div>
                            <div class="pkg-price">0.59$</div>
                        </div>
                    </a>

                    <!-- Option 2: 100 Robux -->
                    <a href="https://t.me/Longzzsmmdigitall" target="_blank" class="package-card">
                        <div class="rgb-glow"></div>
                        <div class="package-content">
                            <div class="pkg-info">
                                <i class="fa-solid fa-coins"></i>
                                <span>100 Robux</span>
                            </div>
                            <div class="pkg-price">1.10$</div>
                        </div>
                    </a>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal Popup មេនុឺដើម (ចុចរូបផ្ទះ) -->
    <div class="modal-overlay" id="storeModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="modal-title">ជ្រើសរើសសេវាកម្ម</div>
            
            <!-- ប៊ូតុងបើកផ្ទាំងគណនី -->
            <button class="modal-btn btn-account" id="openAccountModalBtn">
                <i class="fa-solid fa-user-circle"></i>
                <span id="accountBtnText">បង្កើត / ចូលគណនី</span>
            </button>

            <!-- ប៊ូតុងទាក់ទង Admin Telegram -->
            <a href="https://t.me/Longzzsmmdigitall" target="_blank" class="modal-btn btn-telegram">
                <i class="fa-brands fa-telegram"></i>
                <span>ទំនាក់ទំនង Admin</span>
            </a>
        </div>
    </div>

    <!-- Modal Popup សម្រាប់ បង្កើត/ចូល គណនី -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-content">
            <button class="modal-close" id="closeAccountModalBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- 폼ចុះឈ្មោះ (Register Form) -->
            <div id="registerFormContainer" class="form-container">
                <div class="modal-title">បង្កើតគណនីថ្មី</div>
                <input type="text" id="regUsername" class="form-input" placeholder="ឈ្មោះ (Username)">
                <input type="password" id="regPassword" class="form-input" placeholder="លេខកូដ (Password)">
                <div class="form-error" id="regError"></div>
                <button class="modal-btn btn-account" id="submitRegisterBtn">ចុះឈ្មោះ</button>
                <div class="switch-form-text" id="switchToLogin">មានគណនីរួចហើយ? ចូលគណនី</div>
            </div>

            <!-- 폼ចូលគណនី (Login Form) -->
            <div id="loginFormContainer" class="form-container" style="display: none;">
                <div class="modal-title">ចូលគណនី</div>
                <input type="text" id="loginUsername" class="form-input" placeholder="ឈ្មោះ (Username)">
                <input type="password" id="loginPassword" class="form-input" placeholder="លេខកូដ (Password)">
                <div class="form-error" id="loginError"></div>
                <button class="modal-btn btn-account" id="submitLoginBtn">ចូលគណនី</button>
                <div class="switch-form-text" id="switchToRegister">មិនទាន់មានគណនី? បង្កើតថ្មី</div>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle Script (Inline Button)
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            htmlElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
            themeText.innerText = 'Light Mode';
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                themeText.innerText = 'Dark Mode';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                themeText.innerText = 'Light Mode';
            }
        });

        // Toggle Roblox Packages
        const robloxCard = document.getElementById('robloxCard');
        robloxCard.addEventListener('click', () => {
            robloxCard.classList.toggle('active');
        });

        // Store Modal Logic
        const storeModalBtn = document.getElementById('storeModalBtn');
        const storeModal = document.getElementById('storeModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        storeModalBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            storeModal.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            storeModal.classList.remove('active');
        });

        storeModal.addEventListener('click', (e) => {
            if (e.target === storeModal) storeModal.classList.remove('active');
        });

        // Account System Logic
        const accountModal = document.getElementById('accountModal');
        const openAccountModalBtn = document.getElementById('openAccountModalBtn');
        const closeAccountModalBtn = document.getElementById('closeAccountModalBtn');
        
        const registerFormContainer = document.getElementById('registerFormContainer');
        const loginFormContainer = document.getElementById('loginFormContainer');
        const switchToLogin = document.getElementById('switchToLogin');
        const switchToRegister = document.getElementById('switchToRegister');

        const userProfileDisplay = document.getElementById('userProfileDisplay');
        const displayUsername = document.getElementById('displayUsername');
        const logoutBtn = document.getElementById('logoutBtn');
        const accountBtnText = document.getElementById('accountBtnText');

        openAccountModalBtn.addEventListener('click', () => {
            storeModal.classList.remove('active');
            accountModal.classList.add('active');
        });

        closeAccountModalBtn.addEventListener('click', () => {
            accountModal.classList.remove('active');
        });

        accountModal.addEventListener('click', (e) => {
            if (e.target === accountModal) accountModal.classList.remove('active');
        });

        switchToLogin.addEventListener('click', () => {
            registerFormContainer.style.display = 'none';
            loginFormContainer.style.display = 'flex';
        });

        switchToRegister.addEventListener('click', () => {
            loginFormContainer.style.display = 'none';
            registerFormContainer.style.display = 'flex';
        });

        function checkLoginState() {
            const loggedUser = localStorage.getItem('loggedUser');
            if (loggedUser) {
                userProfileDisplay.style.display = 'flex';
                displayUsername.innerHTML = `<span>${loggedUser}</span> <i class="fa-solid fa-circle-check blue-tick" title="Verified"></i>`;
                accountBtnText.innerText = 'គណនីរបស់ខ្ញុំ';
            } else {
                userProfileDisplay.style.display = 'none';
                accountBtnText.innerText = 'បង្កើត / ចូលគណនី';
            }
        }
        checkLoginState();

        const submitRegisterBtn = document.getElementById('submitRegisterBtn');
        const regUsername = document.getElementById('regUsername');
        const regPassword = document.getElementById('regPassword');
        const regError = document.getElementById('regError');

        submitRegisterBtn.addEventListener('click', () => {
            const u = regUsername.value.trim();
            const p = regPassword.value.trim();

            if (!u || !p) {
                regError.innerText = 'សូមបំពេញឈ្មោះ និងលេខកូដ!';
                return;
            }

            let users = JSON.parse(localStorage.getItem('savedUsers')) || {};

            if (users[u]) {
                regError.innerText = 'ឈ្មោះនេះមានគេប្រើរួចហើយ!';
                return;
            }

            users[u] = p;
            localStorage.setItem('savedUsers', JSON.stringify(users));
            localStorage.setItem('loggedUser', u);

            regError.innerText = '';
            regUsername.value = '';
            regPassword.value = '';
            accountModal.classList.remove('active');
            checkLoginState();
            alert('បង្កើតគណនីជោគជ័យ!');
        });

        const submitLoginBtn = document.getElementById('submitLoginBtn');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');

        submitLoginBtn.addEventListener('click', () => {
            const u = loginUsername.value.trim();
            const p = loginPassword.value.trim();

            if (!u || !p) {
                loginError.innerText = 'សូមបំពេញឈ្មោះ និងលេខកូដ!';
                return;
            }

            let users = JSON.parse(localStorage.getItem('savedUsers')) || {};

            if (!users[u] || users[u] !== p) {
                loginError.innerText = 'ឈ្មោះ ឬ លេខកូដ មិនត្រឹមត្រូវទេ!';
                return;
            }

            localStorage.setItem('loggedUser', u);
            loginError.innerText = '';
            loginUsername.value = '';
            loginPassword.value = '';
            accountModal.classList.remove('active');
            checkLoginState();
            alert('ចូលគណនីបានជោគជ័យ!');
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('loggedUser');
            checkLoginState();
            alert('បានចាកចេញពីគណនី!');
        });
    </script>
</body>
</html>
