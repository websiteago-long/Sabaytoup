<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABAY TOUP - Roblox TopUp</title>
    <!-- FontAwesome សម្រាប់ Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #111111;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ប៊ូតុងប្ដូរ Theme ពណ៌ស/ខ្មៅ */
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--text-color);
            color: var(--text-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px var(--shadow-color);
            z-index: 100;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1);
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header Card (ទម្រង់ 3D) */
        .header-card {
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 25px var(--shadow-color),
                        inset 0 2px 3px rgba(255,255,255,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: perspective(1000px) rotateX(2deg);
        }

        .store-icon {
            background: #d1d5db;
            color: #111;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .store-icon:hover {
            transform: scale(1.05);
        }

        .header-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Menu Section */
        .menu-section {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .sidebar-indicators {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 15px;
        }

        .indicator-bar {
            width: 8px;
            height: 35px;
            background-color: #8b5cf6;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(139, 92, 246, 0.4);
        }

        .indicator-bar:not(.active) {
            opacity: 0.6;
            height: 25px;
        }

        /* Roblox Main Card */
        .roblox-main-card {
            flex-grow: 1;
            background-color: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 30px var(--shadow-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .roblox-main-card:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-3px);
            box-shadow: 0 16px 35px var(--shadow-color);
        }

        .roblox-logo-box {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
            background: var(--card-bg);
        }

        /* Logo Roblox ទម្រង់ 3D */
        .roblox-cube {
            width: 40px;
            height: 40px;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .inner-cube {
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 3px;
            transform: rotate(20deg);
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .sub-badge {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .sub-badge i {
            transition: transform 0.3s ease;
        }

        /* Pricing Packages Container (លាក់ទុកដំបូង) */
        .packages-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--card-bg);
        }

        /* ពេលបើកកាត (Active) */
        .roblox-main-card.active .packages-container {
            max-height: 300px;
            padding: 15px;
        }

        .roblox-main-card.active .sub-badge i {
            transform: rotate(180deg);
        }

        /* Package Option Card with RGB Lighting */
        .package-card {
            position: relative;
            border-radius: 14px;
            padding: 3px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 5px 15px var(--shadow-color);
        }

        /* បែបផែនភ្លើង RGB រត់ជុំវិញ Package Button */
        .rgb-glow {
            position: absolute;
            inset: -50%;
            background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000);
            animation: rgbRotate 4s linear infinite;
            z-index: 1;
        }

        @keyframes rgbRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .package-content {
            position: relative;
            background-color: var(--card-bg);
            border-radius: 11px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .pkg-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-color);
        }

        .pkg-info i {
            color: #eab308;
        }

        .pkg-price {
            background: #8b5cf6;
            color: #ffffff;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 3px 8px rgba(139, 92, 246, 0.4);
        }

        /* Modal Popup Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 350px;
            padding: 25px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 15px 35px var(--shadow-color);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }

        .modal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 10px var(--shadow-color);
            transition: transform 0.2s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }

        .btn-account {
            background-color: #3b82f6;
            color: #ffffff;
        }

        .btn-telegram {
            background-color: #229ed9;
            color: #ffffff;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ប៊ូតុងប្ដូរ Theme (Dark/Light Mode) -->
    <button class="theme-toggle-btn" id="themeToggleBtn">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="container">
        <!-- Header: SABAY TOUP -->
        <div class="header-card">
            <!-- រូបផ្ទះ / Icon ហាង ចុចដើម្បីបើក Menu -->
            <div class="store-icon" id="storeModalBtn">
                <i class="fa-solid fa-store"></i>
            </div>
            <h1>SABAY TOUP</h1>
        </div>

        <!-- Section: Roblox TopUp (ចុចដើម្បីបង្ហាញកញ្ចប់តម្លៃ) -->
        <div class="menu-section">
            <div class="sidebar-indicators">
                <span class="indicator-bar active"></span>
                <span class="indicator-bar"></span>
                <span class="indicator-bar"></span>
            </div>

            <div class="roblox-main-card" id="robloxCard">
                <div class="roblox-logo-box">
                    <div class="roblox-cube">
                        <div class="inner-cube"></div>
                    </div>
                    <span class="brand-name">Roblox</span>
                </div>
                <div class="sub-badge">
                    <span>TopUp Packages</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>

                <!-- តារាងតម្លៃដែលលាក់ទុក -->
                <div class="packages-container">
                    
                    <!-- Option 1: 40 Robux -->
                    <a href="https://t.me/Longzzsmmdigitall" target="_blank" class="package-card">
                        <div class="rgb-glow"></div>
                        <div class="package-content">
                            <div class="pkg-info">
                                <i class="fa-solid fa-coins"></i>
                                <span>40 Robux</span>
                            </div>
                            <div class="pkg-price">0.59$</div>
                        </div>
                    </a>

                    <!-- Option 2: 100 Robux -->
                    <a href="https://t.me/Longzzsmmdigitall" target="_blank" class="package-card">
                        <div class="rgb-glow"></div>
                        <div class="package-content">
                            <div class="pkg-info">
                                <i class="fa-solid fa-coins"></i>
                                <span>100 Robux</span>
                            </div>
                            <div class="pkg-price">1.10$</div>
                        </div>
                    </a>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal Popup សម្រាប់បង្កើតអាខោន និងទាក់ទង Telegram -->
    <div class="modal-overlay" id="storeModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="modal-title">ជ្រើសរើសសេវាកម្ម</div>
            
            <!-- ប៊ូតុងបង្កើតអាខោន -->
            <a href="#" class="modal-btn btn-account">
                <i class="fa-solid fa-user-plus"></i>
                <span>បង្កើតអាខោន</span>
            </a>

            <!-- ប៊ូតុងទាក់ទង Admin Telegram -->
            <a href="https://t.me/Longzzsmmdigitall" target="_blank" class="modal-btn btn-telegram">
                <i class="fa-brands fa-telegram"></i>
                <span>ទំនាក់ទំនង Admin</span>
            </a>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlElement = document.documentElement;
        const icon = themeToggleBtn.querySelector('i');

        // ចងចាំ Theme
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            htmlElement.setAttribute('data-theme', 'dark');
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggleBtn.addEventListener('click', () => {
            if (htmlElement.getAttribute('data-theme') === 'dark') {
                htmlElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                icon.classList.replace('fa-sun', 'fa-moon');
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        });

        // Script សម្រាប់បង្ហាញ/លាក់ កញ្ចប់តម្លៃ Roblox ពេលចុចលើកាត
        const robloxCard = document.getElementById('robloxCard');
        robloxCard.addEventListener('click', () => {
            robloxCard.classList.toggle('active');
        });

        // Script សម្រាប់គ្រប់គ្រង Modal Popup (ចុចរូបផ្ទះ)
        const storeModalBtn = document.getElementById('storeModalBtn');
        const storeModal = document.getElementById('storeModal');
        const closeModalBtn = document.getElementById('closeModalBtn');

        storeModalBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // មិនឱ្យប៉ះពាល់ដល់ព្រឹត្តិការណ៍ចុចលើ card
            storeModal.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            storeModal.classList.remove('active');
        });

        // បិទ Modal ពេលចុចក្រៅផ្ទាំង
        storeModal.addEventListener('click', (e) => {
            if (e.target === storeModal) {
                storeModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
